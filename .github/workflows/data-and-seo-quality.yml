name: Data and SEO quality

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://loverezhao.top
          INDEXABLE_LOCALES: en
      - run: pnpm run seo:verify
        env:
          NEXT_PUBLIC_SITE_URL: https://loverezhao.top
          INDEXABLE_LOCALES: en
